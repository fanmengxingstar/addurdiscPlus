plugins {
	// Legacy Minecraft releases use Mojang mappings and a remapped distributable jar.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

loom {
	// src/main/java is compiled against the dedicated server jar, so a client class referenced from
	// here is a compile error rather than a crash on the first server boot. The two halves still ship
	// as one jar.
	splitEnvironmentSourceSets()
    mixin { useLegacyMixinAp = true; defaultRefmapName = "addurdisc-refmap.json" }
}

base {
	archivesName = "AddurDisc-Fabric-${project.minecraft_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
	// Fabric dependencies must be remapped into the named development namespace.
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
