plugins {
	// Since Minecraft 26.1 the game ships unobfuscated, so no remapping (and no `mappings`
	// dependency) is required any more, and the plugin id changed to `net.fabricmc.fabric-loom`.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

loom {
	// src/main/java is compiled against the dedicated server jar, so a client class referenced from
	// here is a compile error rather than a crash on the first server boot. The two halves still ship
	// as one jar.
	splitEnvironmentSourceSets()
}

base {
	archivesName = "AddurDisc-Fabric-${project.minecraft_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// This loom registers no `modImplementation` configuration. `implementation` is what it feeds
	// into the mod compile classpath and into the development runtime.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}
